[tools]
node = "24"

[tasks]
  [tasks."dev"]
  run = "vite dev --port=5173"

  [tasks.build]
  run = "vite build"

  [tasks.lint]
  run = "eslint src"

  [tasks.test]
  run = "vitest run"

  [tasks.testui]
  run = { tasks = [ "dev", "testui:*" ]}
  env = { DOM_PREVIEW = "true" }

  [tasks."testui:unit"]
  run = "vitest --ui"

  [tasks."testui:dom-preview"]
  run = "dom-preview --proxy-to=http://localhost:5173"

  [tasks.clean]
  run = "git clean -dX --exclude=\"!.env\" --exclude=\"!mise.local.toml\" --force"

  [tasks.refresh]
  depends = [ "clean" ]
  run = [
    "rm --force ./pnpm-lock.yaml",
    "corepack enable",
    "corepack up",
    "pnpm install"
  ]

[hooks]
postinstall = [
  "corepack enable",
  "pnpm install --frozen-lockfile",
]

[env]
_.path = "./node_modules/.bin"

[settings]
jobs = 8

# Required for hooks as of 2025.10
# https://mise.jdx.dev/hooks.html
experimental = true
